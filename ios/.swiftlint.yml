included:
  - PouleParty
  - PoulePartyTests
  - PoulePartyWidgets
  - PoulePartySnapshotTests
excluded:
  - PoulePartySnapshotTests/__Snapshots__
  - build
  - DerivedData
  - SourcePackages
disabled_rules:
  - trailing_comma
  - inclusive_language
line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true
  excluded_lines_patterns:
    - '^\s*(Text|TextState|BangerText|Label|logger\.\w+|#expect)\('
    - '^\s*(description|explanation|title|subtitle): "'
identifier_name:
  min_length: 1
  allowed_symbols: ["_"]
nesting:
  type_level: 3
large_tuple:
  warning: 6
file_length:
  warning: 1300
  error: 2000
type_body_length:
  warning: 1100
  error: 1500
function_body_length:
  warning: 300
  error: 400
function_parameter_count:
  warning: 8
  error: 10
cyclomatic_complexity:
  warning: 30
  error: 60
