name: Deploy iOS

on:
  push:
    tags:
      - ios-v*

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-ios
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 75
    environment: production
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the iOS and Android versions
        run: scripts/check-release-version.sh "${GITHUB_REF_NAME#ios-v}"

      - name: Select the newest Xcode
        id: xcode
        run: ios/Scripts/ci/select-xcode.sh

      - name: Restore Swift packages from the main branch cache
        uses: actions/cache/restore@v6
        with:
          path: |
            DerivedData
            !DerivedData/Logs
          key: ios-deriveddata-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/PouleParty.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ios-deriveddata-${{ steps.xcode.outputs.version }}-

      - name: Restore the production Firebase plist and the Mapbox token
        env:
          GOOGLE_SERVICE_INFO_PLIST_PROD_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PROD_BASE64 }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: ios/Scripts/ci/restore-ios-config.sh

      - name: Archive
        run: ios/Scripts/ci/archive.sh "$((GITHUB_RUN_NUMBER + 1000))" "$RUNNER_TEMP/PouleParty.xcarchive"

      - name: Wait for Verify on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/ci/wait-for-verify.sh "$GITHUB_SHA"

      - name: Upload to TestFlight
        run: ios/Scripts/ci/upload-testflight.sh "$RUNNER_TEMP/PouleParty.xcarchive"
