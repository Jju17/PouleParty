name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/check-commit-messages.sh "origin/${{ github.base_ref }}..HEAD"

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: 21
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npm install --global firebase-tools@15.33.0
      - run: npm run test:rules
      - run: npm run test:coverage

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run test:coverage

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      ORG_GRADLE_PROJECT_MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      MAPBOX_ACCESS_TOKEN: pk.ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: cp ../ci/firebase/google-services.placeholder.json app/google-services.json
      - run: ./gradlew testStagingDebugUnitTest lintStagingDebug koverXmlReportStagingDebug

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode
        run: Scripts/ci/select-xcode.sh
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ hashFiles('ios/PouleParty.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-
      - run: mkdir -p Firebase/Staging && cp ../ci/firebase/GoogleService-Info.placeholder.plist Firebase/Staging/GoogleService-Info.plist
      - run: cp Config/Secrets.xcconfig.example Config/Secrets.xcconfig
      - run: brew install swiftlint
      - run: swiftlint --strict
      - run: >-
          xcodebuild test
          -scheme PoulePartyTests
          -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17'
          -enableCodeCoverage YES
          -derivedDataPath ../DerivedData
          -skipPackagePluginValidation -skipMacroValidation
          COMPILER_INDEX_STORE_ENABLE=NO
