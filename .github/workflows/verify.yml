name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: scripts/check-commit-messages.sh "origin/${{ github.base_ref }}..HEAD"

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npm install --global firebase-tools@15.33.0
      - run: npm run test:rules
      - run: npm run test:coverage

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run test:coverage

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      ORG_GRADLE_PROJECT_MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      MAPBOX_ACCESS_TOKEN: pk.ci-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: cp ../ci/firebase/google-services.placeholder.json app/google-services.json
      - run: ./gradlew testStagingDebugUnitTest lintStagingDebug koverXmlReportStagingDebug

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p Firebase/Staging && cp ../ci/firebase/GoogleService-Info.placeholder.plist Firebase/Staging/GoogleService-Info.plist
      - run: cp Config/Secrets.xcconfig.example Config/Secrets.xcconfig
      - run: swiftlint --strict
      - run: >-
          xcodebuild test
          -scheme PoulePartyTests
          -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17'
          -enableCodeCoverage YES
          -skipPackagePluginValidation -skipMacroValidation
